name: Release

# release-please reads the Conventional Commit subjects squash-merged to main and keeps one
# release pull request open that bumps the version (package.json, package-lock.json and the
# style.css header) and writes CHANGELOG.md. Merging that pull request tags vX.Y.Z on main and
# publishes the GitHub release with the changelog entry as notes.
#
# Before the first run:
# - Allow GitHub Actions to create pull requests (repository or organisation settings, Actions,
#   General, Workflow permissions). Without it release-please cannot open its pull request.
# - Squash-merge pull requests and use the pull request title as the commit subject, so each title
#   becomes one Conventional Commit on main (the PR Title workflow checks the format).
#
# The tag and the release are created with GITHUB_TOKEN, and GitHub starts no workflow runs for
# events GITHUB_TOKEN causes. A workflow that deploys `on: push: tags` never fires for these tags.
# Deploy from this workflow instead, in a job gated on the release output:
#
#   deploy:
#     needs: release-please
#     if: needs.release-please.outputs.release-created == 'true'
#
# or switch the token below to a GitHub App token. The release pull request is opened with
# GITHUB_TOKEN too, so it gets no CI runs; that is why neither check should be a required status
# check unless you switch tokens.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Serialise runs so two merges in quick succession can't race on the release pull request.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag-name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Open or update the release pull request, or publish the release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
