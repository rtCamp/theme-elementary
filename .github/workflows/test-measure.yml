name: Test and Measure

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  ci:
    uses: rtCamp/wp-shared-workflows/.github/workflows/wp-ci.yml@release/v1.0.0
    with:
      project-type: theme
      enable-phpstan: true
      php-versions: '["8.2", "8.3", "8.4"]'
      wp-versions: '["6.5", "6.6", "6.7", "6.8", "6.9", "7.0"]'
      # WordPress added PHP 8.4 support in 6.7.
      test-php-exclude: '[{"php": "8.4", "wp": "6.5"}, {"php": "8.4", "wp": "6.6"}]'

      # Optional wp-ci inputs, upstream defaults — uncomment to change.
      # skip: ''                # lint-css,lint-js,lint-php,test-js,test-php,build,build-artifact,a11y
      # run-a11y: false         # or: ${{ contains(github.event.pull_request.labels.*.name, 'Run a11y') }}
      # use-wp-env: true        # false = standalone PHPUnit, no WordPress
      # build-artifact-path: '' # installable dir the build emits; empty skips the install test
      # build-artifact-slug: '' # empty = repo name (theme-elementary)
      # Jobs also gate on changed files: no .php changes = no lint-php.
    secrets:
      # WP_FRAMEWORK_REPO_TEMP_TOKEN must have read access to both private repos:
      #   - rtCamp/wp-tooling   (detect-changes installs the interim CLI from it)
      #   - rtCamp/wp-framework (composer install in lint-php / test-php)
      wp-tooling-token: ${{ secrets.WP_FRAMEWORK_REPO_TEMP_TOKEN }}
      packages-token: ${{ secrets.WP_FRAMEWORK_REPO_TEMP_TOKEN }}
