# Groups GitHub's automatically generated release notes by the shared labels
# in .github/labels.yml. A pull request goes under the first category whose
# labels it carries; an unlabelled one goes under "Other".
changelog:
  exclude:
    # Dependabot's routine bumps are noise in release notes. A dependency
    # change a person makes still shows under "Dependencies".
    authors:
      - dependabot
      - dependabot[bot]
      - dependabot-preview
  categories:
    - title: Breaking changes
      labels:
        - "BC: Breaking"
    - title: Features
      labels:
        - "BC: Additive"
    - title: Fixes
      labels:
        - "Type: Bug"
    - title: Docs
      labels:
        - "Type: Docs"
    - title: Dependencies
      labels:
        - dependencies
        # .github/dependabot.yml spells it with a capital D.
        - Dependencies
    - title: Other
      labels:
        - "*"
