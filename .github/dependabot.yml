version: 2
updates:
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
      time: '00:00'
      timezone: 'Asia/Calcutta'
    open-pull-requests-limit: 10
    labels:
      - GHA
      - Dependencies

  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
      time: '00:00'
      timezone: 'Asia/Calcutta'
    open-pull-requests-limit: 10
    labels:
      - NPM
      - Dependencies
    groups:
      wordpress-packages:
        patterns:
          - "@wordpress/*"
    ignore:
      # Babel 8 is a major; the WordPress build tooling (@wordpress/scripts,
      # @wordpress/babel-preset-default) is still on Babel 7.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: composer
    directory: '/'
    schedule:
      interval: monthly
      time: '00:00'
      timezone: 'Asia/Calcutta'
    open-pull-requests-limit: 10
    labels:
      - Composer
      - Dependencies
    ignore:
      # i18n-command 3 needs WP-CLI 3, and the wp-env cli container ships WP-CLI 2.
      - dependency-name: "wp-cli/i18n-command"
        update-types: ["version-update:semver-major"]
